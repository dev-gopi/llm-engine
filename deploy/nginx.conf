worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format safe '$remote_addr - $request_id [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=gopi_per_ip:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=gopi_connections:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream gopi_api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 256k;
        client_body_timeout 15s;
        keepalive_timeout 30s;
        send_timeout 300s;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location / {
            limit_req zone=gopi_per_ip burst=10 nodelay;
            limit_conn gopi_connections 8;

            proxy_pass http://gopi_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
