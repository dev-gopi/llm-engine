# Active GPU architecture with a 40K base vocabulary. Selecting the verified
# data/tokenizer-finetuning extension expands it to 42K at load time.
vocab_size: 40000
hidden_size: 512
layers: 16
heads: 8
kv_heads: 2
max_position: 1024
position_type: rotary
rope_base: 10000.0
rope_scale: 1.0
padding_idx: 0
initializer_range: 0.02
embedding_dropout: 0.0
scale_embeddings: false
freeze_embeddings: false
tie_word_embeddings: true
lm_head_bias: false
attention_dropout: 0.0
attention_bias: false
causal_attention: true
ffn_hidden_size: 2048
ffn_multiple_of: 128
ffn_activation: swiglu
ffn_dropout: 0.0
ffn_bias: false
norm_type: rms_norm
norm_eps: 0.00001
norm_bias: false
pre_norm: true
residual_dropout: 0.0
residual_scale: 1.0
# Required for stable training on 4 GB GPUs.  This recomputes layer activations
# during backward rather than retaining them, trading some speed for much lower
# peak VRAM use.
gradient_checkpointing: true
