# Gopi Audio Gen v2 - high-quality text-to-audio profile.
# Intended for a modern 24 GB+ CUDA GPU. Use local_4gb.yaml for laptop development.
seed: 42
tokenizer: data/tokenizer-finetuning
train_manifest: data/audio/train.jsonl
validation_manifest: data/audio/validation.jsonl

# Data / output quality
sample_rate: 32000
duration_seconds: 12.0
generation_seconds: 12.0
train_crop: random
validation_crop: center
peak_normalize: true

# Trainable text encoder + token-level cross-attention
text_hidden_size: 768
text_layers: 10
text_heads: 12
text_max_length: 160
text_dropout: 0.05

# Latent codec
# 2^8 = 256x temporal compression before diffusion.
autoencoder_channels: 160
latent_channels: 128
downsample_stages: 8

# Denoiser
model_channels: 640
blocks: 28
dropout: 0.05
cross_attention_every: 2
cross_attention_heads: 10

# Diffusion / stability
timesteps: 1000
noise_schedule: cosine
beta_start: 0.0001
beta_end: 0.02
condition_dropout: 0.12
reconstruction_weight: 0.12
min_snr_gamma: 5.0
noise_offset: 0.02
input_perturbation: 0.05

# Sampling
guidance_scale: 5.0
inference_steps: 100
ddim_eta: 0.0

# Optimization
batch_size: 6
validation_batch_size: 3
gradient_accumulation_steps: 8
epochs: 120
learning_rate: 0.00008
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 1.0e-8
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.03
max_grad_norm: 1.0
ema_decay: 0.9999
mixed_precision: bf16
fused_optimizer: true
allow_tf32: true
cudnn_benchmark: true
matmul_precision: high

# Loader / checkpointing
num_workers: 8
pin_memory: true
persistent_workers: true
prefetch_factor: 3
drop_last: true
validation_seed: 12345
log_every_steps: 20
save_every_steps: 250
output: checkpoints/audio_generation/latest.pt
best_output: checkpoints/audio_generation/best.pt

# Named inference presets exposed by CLI/API
inference_presets:
  draft: {steps: 20, guidance_scale: 3.5, eta: 0.0}
  balanced: {steps: 40, guidance_scale: 4.5, eta: 0.0}
  quality: {steps: 70, guidance_scale: 5.5, eta: 0.0}
  max_quality: {steps: 100, guidance_scale: 6.0, eta: 0.0}
