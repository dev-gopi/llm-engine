# Gopi Audio Gen v3 Ultra - research/production target for 48 GB+ GPUs.
seed: 42
tokenizer: data/tokenizer-finetuning
train_manifest: data/audio/train.jsonl
validation_manifest: data/audio/validation.jsonl
sample_rate: 48000
duration_seconds: 20.0
generation_seconds: 20.0
train_crop: random
validation_crop: center
peak_normalize: true
text_hidden_size: 1024
text_layers: 16
text_heads: 16
text_max_length: 256
text_dropout: 0.05
autoencoder_channels: 192
latent_channels: 160
downsample_stages: 8
model_channels: 768
blocks: 36
dropout: 0.05
cross_attention_every: 1
cross_attention_heads: 16
timesteps: 1000
noise_schedule: cosine
beta_start: 0.0001
beta_end: 0.02
condition_dropout: 0.12
reconstruction_weight: 0.10
min_snr_gamma: 5.0
noise_offset: 0.02
input_perturbation: 0.05
guidance_scale: 6.0
inference_steps: 120
ddim_eta: 0.0
batch_size: 4
validation_batch_size: 2
gradient_accumulation_steps: 16
epochs: 160
learning_rate: 0.00006
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 1.0e-8
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.02
max_grad_norm: 1.0
ema_decay: 0.99995
mixed_precision: bf16
fused_optimizer: true
allow_tf32: true
cudnn_benchmark: true
matmul_precision: high
num_workers: 12
pin_memory: true
persistent_workers: true
prefetch_factor: 4
drop_last: true
validation_seed: 12345
log_every_steps: 10
save_every_steps: 200
output: checkpoints/audio_generation/ultra-latest.pt
best_output: checkpoints/audio_generation/ultra-best.pt
inference_presets:
  draft: {steps: 24, guidance_scale: 4.0, eta: 0.0}
  balanced: {steps: 50, guidance_scale: 5.0, eta: 0.0}
  quality: {steps: 90, guidance_scale: 6.0, eta: 0.0}
  max_quality: {steps: 140, guidance_scale: 6.5, eta: 0.0}
