# Future distributed-training example. This does not replace any current profile.
vocab_size: 32000
hidden_size: 2048
layers: 24
heads: 16
kv_heads: 4
max_position: 8192
position_type: rotary
rope_base: 10000.0
rope_scale: 1.0
padding_idx: 0
initializer_range: 0.02
embedding_dropout: 0.0
scale_embeddings: false
freeze_embeddings: false
tie_word_embeddings: true
lm_head_bias: false
attention_dropout: 0.0
attention_bias: false
causal_attention: true
ffn_hidden_size: 5504
ffn_multiple_of: 256
ffn_activation: swiglu
ffn_dropout: 0.0
ffn_bias: false
norm_type: rms_norm
norm_eps: 0.00001
norm_bias: false
pre_norm: true
residual_dropout: 0.0
residual_scale: 1.0
gradient_checkpointing: true
