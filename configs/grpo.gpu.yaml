batch_size: 1
validation_batch_size: 1
epochs: 1
seed: 42
max_sequence_length: 256
num_workers: 2
train_files:
  - data/processed/grpo/train.jsonl
validation_files:
  - data/processed/grpo/validation.jsonl
dataset_governance:
  policy: warn
  stage: grpo
  commercial_use: false
learning_rate: 0.000005
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: false
gradient_clip_norm: 1.0
mixed_precision: fp16
distributed_strategy: ddp
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.1
clip_epsilon: 0.2
beta: 0.04
log_every: 10
early_stopping_patience: 2
runtime:
  tokenizer: data/tokenizer-finetuning
  output: checkpoints/grpo/latest.pt
  best_output: checkpoints/grpo/best.pt
