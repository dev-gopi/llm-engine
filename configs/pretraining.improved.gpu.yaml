# Bounded experiment; prepare with scripts/prepare_pretraining_experiment.py.
# Initialize weights with --init-from; use a separate checkpoint directory.
batch_size: 1
epochs: 1
seed: 42
dataset_governance:
  policy: warn
  stage: pretraining
  commercial_use: false
max_sequence_length: 512
num_workers: 1
pin_memory: true
persistent_workers: true
prefetch_factor: 2
lazy_dataset: true
distributed_strategy: ddp
distributed_backend: null
checkpoint_format: single_file
samples_per_epoch: 4096
train_files:
- data/cleaned/pretraining-pilot/tinystories/train.packed.jsonl
- data/cleaned/pretraining-pilot/wikitext_103/train.packed.jsonl
- data/cleaned/pretraining-pilot/fineweb_edu/train.packed.jsonl
- data/cleaned/pretraining-pilot/code_pretraining/train.packed.jsonl
dataset_weights: &id001
  tinystories: 0.2
  wikitext_103: 0.35
  fineweb_edu: 0.4
  code_pretraining: 0.05
validation_files:
- data/cleaned/pretraining-pilot/tinystories/validation.packed.jsonl
- data/cleaned/pretraining-pilot/wikitext_103/validation.packed.jsonl
- data/cleaned/pretraining-pilot/fineweb_edu/validation.packed.jsonl
- data/cleaned/pretraining-pilot/code_pretraining/validation.packed.jsonl
validation_domains:
  tinystories:
  - data/cleaned/pretraining-pilot/tinystories/validation.packed.jsonl
  wikitext_103:
  - data/cleaned/pretraining-pilot/wikitext_103/validation.packed.jsonl
  fineweb_edu:
  - data/cleaned/pretraining-pilot/fineweb_edu/validation.packed.jsonl
  code_pretraining:
  - data/cleaned/pretraining-pilot/code_pretraining/validation.packed.jsonl
validation_weights: *id001
validation_metric_name: pilot_packed_four_domains_v1
learning_rate: 1.0e-05
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
adam_epsilon: 1.0e-08
fused_optimizer: false
gradient_clip_norm: 1.0
gradient_accumulation_steps: 32
mixed_precision: fp16
grad_scaler_initial_scale: 1024
grad_scaler_growth_interval: 20000
lr_schedule: cosine
warmup_ratio: 0.05
min_lr_ratio: 0.1
ema_decay: 0.999
log_every: 25
checkpoint_every: 100
evaluate_every: 100
early_stopping_patience: 3
early_stopping_min_delta: 0.001
ignore_index: -100
label_smoothing: 0.0
z_loss_coefficient: 0.0001
shift_labels: true
loss_reduction: mean
