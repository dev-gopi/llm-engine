# Gopi Video Gen v2 development profile for ~4 GB VRAM.
seed: 42
tokenizer: data/tokenizer-finetuning
train_manifest: data/video/train.jsonl
validation_manifest: data/video/validation.jsonl
frames: 8
height: 64
width: 64
fps: 8
train_frame_sampling: random_contiguous
validation_frame_sampling: center_contiguous
horizontal_flip_probability: 0.5
text_hidden_size: 192
text_layers: 3
text_heads: 4
text_max_length: 80
text_dropout: 0.05
autoencoder_channels: 24
latent_channels: 8
spatial_stages: 3
temporal_downsample: true
model_channels: 96
blocks: 8
temporal_heads: 4
attention_every: 2
cross_attention_every: 4
cross_attention_heads: 4
cross_attention_chunk_size: 512
dropout: 0.05
timesteps: 1000
noise_schedule: cosine
beta_start: 0.0001
beta_end: 0.02
condition_dropout: 0.12
reconstruction_weight: 0.10
min_snr_gamma: 5.0
noise_offset: 0.01
input_perturbation: 0.02
guidance_scale: 5.0
inference_steps: 40
ddim_eta: 0.0
batch_size: 1
validation_batch_size: 1
gradient_accumulation_steps: 16
epochs: 100
learning_rate: 0.00008
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.05
max_grad_norm: 1.0
ema_decay: 0.999
mixed_precision: fp16
fused_optimizer: false
allow_tf32: true
cudnn_benchmark: true
num_workers: 2
pin_memory: true
persistent_workers: true
prefetch_factor: 2
drop_last: false
validation_seed: 12345
log_every_steps: 5
save_every_steps: 50
output: checkpoints/video_generation/latest.pt
best_output: checkpoints/video_generation/best.pt

# Named inference presets exposed by CLI/API
inference_presets:
  draft: {steps: 20, guidance_scale: 3.5, eta: 0.0}
  balanced: {steps: 40, guidance_scale: 4.5, eta: 0.0}
  quality: {steps: 70, guidance_scale: 5.5, eta: 0.0}
  max_quality: {steps: 100, guidance_scale: 6.0, eta: 0.0}
