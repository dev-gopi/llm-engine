# CTX-002 reproducible long-context training profile.
# Run with: --model-config configs/model.long_context.4k.gpu.yaml
extends: pretraining.gpu.yaml
training_stage_id: ctx-002-long-context-4k-v1
max_sequence_length: 4096
batch_size: 1
validation_batch_size: 1
gradient_accumulation_steps: 32
gradient_checkpointing: true
long_context:
  profile: 4k
  context_length: 4096
  retrieval_validation_required: true
  memory_measurement_required: true

runtime:
  tokenizer: data/tokenizer
  output: checkpoints/pretraining-long-context-4k/latest.pt
  best_output: checkpoints/pretraining-long-context-4k/best.pt
  log_file: logs/pretraining-long-context-4k.log
  report_json: reports/pretraining-long-context-4k.json
