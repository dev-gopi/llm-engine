batch_size: 1
epochs: 5
seed: 42
dataset_governance:
  policy: warn
  stage: mixed
  commercial_use: false
max_sequence_length: 512
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
lazy_dataset: true
distributed_strategy: ddp
distributed_backend: null
checkpoint_format: single_file
samples_per_epoch: 500000
dataset_weights:
  tinystories: 0.25
  wikitext_103: 0.25
  ultrachat_200k: 0.09
  helpsteer: 0.05
  openorca: 0.06
  gsm8k: 0.04
  core_chat: 0.01
  code_instructions: 0.06
  general_qa: 0.05
  safety_alignment: 0.04
  writing_editing: 0.04
  multilingual_bn_hi: 0.02
  multilingual_hi: 0.02
  tool_calling: 0.02
train_files:
  - data/processed/tinystories/train.jsonl
  - data/processed/wikitext_103/train.jsonl
  - data/processed/ultrachat_200k/train.jsonl
  - data/processed/helpsteer/train.jsonl
  - data/processed/openorca/train.jsonl
  - data/processed/gsm8k/train.jsonl
  - data/processed/core_chat/train.jsonl
  - data/processed/code_instructions/train.jsonl
  - data/processed/general_qa/train.jsonl
  - data/processed/safety_alignment/train.jsonl
  - data/processed/writing_editing/train.jsonl
  - data/processed/multilingual_bn_hi/train.jsonl
  - data/processed/multilingual_hi/train.jsonl
  - data/processed/tool_calling/train.jsonl
validation_files:
  - data/processed/tinystories/validation.jsonl
  - data/processed/wikitext_103/validation.jsonl
  - data/processed/ultrachat_200k/validation.jsonl
  - data/processed/helpsteer/validation.jsonl
  - data/processed/openorca/validation.jsonl
  - data/processed/gsm8k/validation.jsonl
  - data/processed/core_chat/validation.jsonl
  - data/processed/code_instructions/validation.jsonl
  - data/processed/general_qa/validation.jsonl
  - data/processed/safety_alignment/validation.jsonl
  - data/processed/writing_editing/validation.jsonl
  - data/processed/multilingual_bn_hi/validation.jsonl
  - data/processed/multilingual_hi/validation.jsonl
  - data/processed/tool_calling/validation.jsonl
validation_domains:
  tinystories:
    - data/processed/tinystories/validation.jsonl
  wikitext_103:
    - data/processed/wikitext_103/validation.jsonl
  english:
    - data/processed/helpsteer/validation.jsonl
    - data/processed/openorca/validation.jsonl
    - data/processed/general_qa/validation.jsonl
    - data/processed/writing_editing/validation.jsonl
    - data/processed/safety_alignment/validation.jsonl
  bengali:
    - data/processed/multilingual_bn_hi/validation.jsonl
  hindi:
    - data/processed/multilingual_hi/validation.jsonl
  coding:
    - data/processed/code_instructions/validation.jsonl
    - data/processed/tool_calling/validation.jsonl
  gsm8k:
    - data/processed/gsm8k/validation.jsonl
  chat:
    - data/processed/ultrachat_200k/validation.jsonl
    - data/processed/core_chat/validation.jsonl
validation_weights:
  tinystories: 0.25
  wikitext_103: 0.25
  english: 0.24
  bengali: 0.02
  hindi: 0.02
  coding: 0.08
  gsm8k: 0.04
  chat: 0.10
validation_metric_name: dataset_weighted_mixed_domains_v1
learning_rate: 0.0001
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: false
gradient_clip_norm: 1.0
gradient_accumulation_steps: 32
mixed_precision: fp16
grad_scaler_initial_scale: 1024
grad_scaler_growth_interval: 20000
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.1
ema_decay: 0.999
log_every: 10
checkpoint_every: 500
evaluate_every: null
early_stopping_patience: 3
early_stopping_min_delta: 0.001
ignore_index: -100
label_smoothing: 0.02
z_loss_coefficient: 0.0
shift_labels: true
loss_reduction: mean
