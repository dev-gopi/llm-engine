batch_size: 1
epochs: 5
seed: 42
max_sequence_length: 256
num_workers: 0
pin_memory: false
lazy_dataset: true
distributed_strategy: ddp
distributed_backend: null
checkpoint_format: single_file
train_files:
  - data/processed/tinystories/train.jsonl
  - data/processed/wikitext_103/train.jsonl
  - data/processed/ultrachat_200k/train.jsonl
  - data/processed/helpsteer/train.jsonl
  - data/processed/openorca/train.jsonl
validation_files:
  - data/processed/tinystories/validation.jsonl
  - data/processed/wikitext_103/validation.jsonl
  - data/processed/ultrachat_200k/validation.jsonl
  - data/processed/helpsteer/validation.jsonl
  - data/processed/openorca/validation.jsonl
learning_rate: 0.0001
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: false
gradient_clip_norm: 1.0
gradient_accumulation_steps: 32
mixed_precision: none
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.1
ema_decay: 0.999
log_every: 10
checkpoint_every: 500
evaluate_every: null
early_stopping_patience: 3
early_stopping_min_delta: 0.001
ignore_index: -100
label_smoothing: 0.02
z_loss_coefficient: 0.0
shift_labels: true
loss_reduction: mean
