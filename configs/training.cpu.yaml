batch_size: 2
epochs: 1
seed: 42
max_sequence_length: 256
num_workers: 0
pin_memory: false
lazy_dataset: true
train_files:
  - data/processed/wikitext_103/train.jsonl
  - data/processed/ultrachat_200k/train.jsonl
  - data/processed/dailydialog/train.jsonl
  - data/processed/databricks-dolly-15k/train.jsonl
  - data/processed/no_robots/train.jsonl
validation_files:
  - data/processed/wikitext_103/validation.jsonl
  - data/processed/ultrachat_200k/validation.jsonl
  - data/processed/dailydialog/validation.jsonl
  - data/processed/databricks-dolly-15k/validation.jsonl
  - data/processed/no_robots/validation.jsonl
learning_rate: 0.0003
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
gradient_clip_norm: 1.0
gradient_accumulation_steps: 4
mixed_precision: none
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.1
ema_decay: 0.999
log_every: 10
checkpoint_every: 1000
ignore_index: -100
label_smoothing: 0.0
z_loss_coefficient: 0.0
shift_labels: true
loss_reduction: mean
