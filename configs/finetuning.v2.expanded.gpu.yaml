  - data/processed/bangla_reading_qa/validation.jsonl
  - data/processed/hindi_history_qa/validation.jsonl
  - data/processed/hinglish_chat/validation.jsonl
  - data/processed/hindi_hinglish/validation.jsonl
  - data/processed/v3_hindi_news/validation.jsonl
  - data/processed/code_alpaca/validation.jsonl
  - data/processed/preferences/validation.jsonl
validation_domains:
    english:
      - data/processed/preferences/validation.jsonl
      - data/processed/helpsteer/validation.jsonl
      - data/processed/openorca/validation.jsonl
      - data/processed/general_qa/validation.jsonl
      - data/processed/writing_editing/validation.jsonl
      - data/processed/safety_alignment/validation.jsonl
    bengali:
      - data/processed/bangla_qa/validation.jsonl
      - data/processed/v3_bengali_news/validation.jsonl
      - data/processed/bangla_reading_qa/validation.jsonl
      - data/processed/multilingual_bn_hi/validation.jsonl
    hindi:
      - data/processed/hindi_history_qa/validation.jsonl
      - data/processed/multilingual_hi/validation.jsonl
      - data/processed/hinglish_chat/validation.jsonl
      - data/processed/hindi_hinglish/validation.jsonl
      - data/processed/v3_hindi_news/validation.jsonl
    coding:
      - data/processed/code_instructions/validation.jsonl
      - data/processed/v3_code_feedback/validation.jsonl
      - data/processed/code_alpaca/validation.jsonl
      - data/processed/tool_calling/validation.jsonl
    gsm8k:
      - data/processed/gsm8k/validation.jsonl
      - data/processed/v3_math_instruct/validation.jsonl
    chat:
      - data/processed/ultrachat_200k/validation.jsonl
      - data/processed/v3_openassistant_en/validation.jsonl
      - data/processed/core_chat/validation.jsonl
      - data/processed/emoji_chat/validation.jsonl
validation_weights:
  english: 0.15
  bengali: 0.14
  hindi: 0.12
  coding: 0.10
  gsm8k: 0.18
  chat: 0.31
validation_metric_name: dataset_weighted_v2_expanded_sft_domains_v1
learning_rate: 0.00001
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: false
gradient_clip_norm: 1.0
gradient_accumulation_steps: 16
mixed_precision: bf16
lr_schedule: cosine
warmup_ratio: 0.05
min_lr_ratio: 0.1
ema_decay: 0.999
log_every: 25
checkpoint_every: 1000
evaluate_every: 2000
early_stopping_patience: 2
early_stopping_min_delta: 0.001
ignore_index: -100
label_smoothing: 0.0
z_loss_coefficient: 0.0001
shift_labels: true
loss_reduction: mean
