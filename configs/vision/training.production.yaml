# Deployment-oriented classifier baseline; change num_classes to match class folders.
image_size: 224
patch_size: 16
channels: 3
hidden_size: 768
layers: 12
heads: 12
ffn_hidden_size: 3072
dropout: 0.1
initializer_range: 0.02
strict_image_size: false
pool_type: cls
num_classes: 1000
classifier_dropout: 0.1
train_data: data/images/vision/train
validation_data: data/images/vision/validation
batch_size: 64
num_workers: 8
epochs: 100
learning_rate: 0.0003
weight_decay: 0.05
label_smoothing: 0.1
max_grad_norm: 1.0
output: checkpoints/vision/latest.pt
seed: 42
horizontal_flip: true
horizontal_flip_probability: 0.5
train_resize_mode: random_crop
eval_resize_mode: center_crop
image_normalization: imagenet
color_jitter: 0.2
mixed_precision: bf16
warmup_ratio: 0.05
lr_schedule: cosine
min_lr_ratio: 0.01
