image_size: 128
patch_size: 16
channels: 3
hidden_size: 192
layers: 4
heads: 3
ffn_hidden_size: 768
dropout: 0.05
initializer_range: 0.02
strict_image_size: true
pool_type: cls
num_classes: 2
classifier_dropout: 0.05
train_data: data/images/vision/train
# Add validation_data after creating a matching class-folder split.
batch_size: 16
num_workers: 2
epochs: 10
learning_rate: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
max_grad_norm: 1.0
output: checkpoints/vision/local.pt
seed: 42
horizontal_flip: true
horizontal_flip_probability: 0.5
train_resize_mode: random_crop
eval_resize_mode: center_crop
image_normalization: minus_one_one
color_jitter: 0.1
mixed_precision: none
warmup_ratio: 0.05
lr_schedule: cosine
min_lr_ratio: 0.1
