image_size: 32
patch_size: 4
channels: 3
hidden_size: 128
layers: 4
heads: 4
ffn_hidden_size: 512
dropout: 0.1
initializer_range: 0.02
strict_image_size: true
pool_type: cls
num_classes: 10
classifier_dropout: 0.1
train_data: data/images/hf-mnist/train
validation_data: data/images/hf-mnist/validation
batch_size: 64
num_workers: 2
epochs: 20
learning_rate: 0.0003
weight_decay: 0.05
label_smoothing: 0.1
max_grad_norm: 1.0
output: checkpoints/vision/hf-sample.pt
seed: 42
horizontal_flip: false
train_resize_mode: center_crop
eval_resize_mode: center_crop
image_normalization: minus_one_one
color_jitter: 0.0
mixed_precision: none
warmup_ratio: 0.05
lr_schedule: cosine
min_lr_ratio: 0.05
