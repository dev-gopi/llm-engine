# Quality-first final SFT profile for the 16-layer model and its 42K append-only
# fine-tuning tokenizer (40K pretrained tokens plus 2K new tokens).
# Sampling covers useful multi-turn chat, mathematical reasoning, coding/tool
# use, Bengali/Hindi responses, and general knowledge. The small causal-LM
# retention share helps preserve broad knowledge without overwhelming SFT.
# Each epoch samples 1M examples (2M total at the configured maximum of two
# epochs). Select the best held-out checkpoint and let early stopping end the
# run sooner when the second pass is no longer improving quality. The effective
# batch of 64 keeps updates stable and preserves the conservative 1e-5 SFT LR.
batch_size: 4
validation_batch_size: 4
epochs: 2
seed: 42
dataset_governance:
  policy: warn
  stage: sft
  commercial_use: false
# This must not exceed model.gpu.yaml:max_position (1024).
max_sequence_length: 1024
pad_to_multiple_of: 8
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
# Domain validation runs sequentially; release each worker pool after use.
validation_num_workers: 1
validation_persistent_workers: false
lazy_dataset: true
distributed_strategy: ddp
distributed_backend: null
checkpoint_format: single_file
samples_per_epoch: 1000000
dataset_weights:
  # Preference data contributes chosen responses only. Wikipedia, FineWeb-Edu,
  # and CodeParrot contribute causal-LM examples at deliberately small shares.
  ultrachat_200k: 0.11
  v2_openassistant_en: 0.05
  helpsteer: 0.06
  # Keep a small OpenOrca share: many local examples contain verbose synthetic
  # task instructions that the compact model otherwise imitates at inference.
  openorca: 0.02
  gsm8k: 0.12
  v2_math_instruct: 0.02
  core_chat: 0.03
  code_instructions: 0.04
  v2_code_feedback: 0.03
  general_qa: 0.10
  # High-confidence unsafe requests are rejected by the runtime prompt filter.
  # Sampling this refusal-only corpus caused refusals to leak into benign turns.
  safety_alignment: 0.00
  writing_editing: 0.04
  multilingual_bn_hi: 0.06
  multilingual_hi: 0.04
  tool_calling: 0.02
  emoji_chat: 0.005
  bangla_qa: 0.025
  v2_bengali_news: 0.02
  bangla_reading_qa: 0.035
  hindi_history_qa: 0.03
  hinglish_chat: 0.01
  hindi_hinglish: 0.02
  v2_hindi_news: 0.015
  code_alpaca: 0.02
  preferences: 0.02
  wikipedia_en: 0.005
  wikipedia_simple: 0.005
  wikipedia_bn: 0.005
  wikipedia_hi: 0.005
  fineweb_edu: 0.03
  code_pretraining: 0.01
train_files:
  - data/processed/ultrachat_200k/train.jsonl
  - data/processed/v2_openassistant_en/train.jsonl
  - data/processed/helpsteer/train.jsonl
  - data/processed/openorca/train.jsonl
  - data/processed/gsm8k/train.jsonl
  - data/processed/v2_math_instruct/train.jsonl
  - data/processed/core_chat/train.jsonl
  - data/processed/code_instructions/train.jsonl
  - data/processed/v2_code_feedback/train.jsonl
  - data/processed/general_qa/train.jsonl
  - data/processed/safety_alignment/train.jsonl
  - data/processed/writing_editing/train.jsonl
  - data/processed/multilingual_bn_hi/train.jsonl
  - data/processed/multilingual_hi/train.jsonl
  - data/processed/tool_calling/train.jsonl
  - data/processed/emoji_chat/train.jsonl
  - data/processed/bangla_qa/train.jsonl
  - data/processed/v2_bengali_news/train.jsonl
  - data/processed/bangla_reading_qa/train.jsonl
  - data/processed/hindi_history_qa/train.jsonl
  - data/processed/hinglish_chat/train.jsonl
  - data/processed/hindi_hinglish/train.jsonl
  - data/processed/v2_hindi_news/train.jsonl
  - data/processed/code_alpaca/train.jsonl
  - data/processed/preferences/train.jsonl
  - data/rag/wikipedia/wikipedia-en.jsonl
  - data/rag/wikipedia/wikipedia-simple.jsonl
  - data/rag/wikipedia/wikipedia-bn.jsonl
  - data/rag/wikipedia/wikipedia-hi.jsonl
  - data/processed/fineweb_edu/train.jsonl
  - data/processed/code_pretraining/train.jsonl
validation_files:
  - data/processed/ultrachat_200k/validation.jsonl
  - data/processed/v2_openassistant_en/validation.jsonl
  - data/processed/helpsteer/validation.jsonl
  - data/processed/openorca/validation.jsonl
  - data/processed/gsm8k/validation.jsonl
  - data/processed/v2_math_instruct/validation.jsonl
  - data/processed/core_chat/validation.jsonl
  - data/processed/code_instructions/validation.jsonl
  - data/processed/v2_code_feedback/validation.jsonl
  - data/processed/general_qa/validation.jsonl
  - data/processed/safety_alignment/validation.jsonl
  - data/processed/writing_editing/validation.jsonl
  - data/processed/multilingual_bn_hi/validation.jsonl
  - data/processed/multilingual_hi/validation.jsonl
  - data/processed/tool_calling/validation.jsonl
  - data/processed/emoji_chat/validation.jsonl
  - data/processed/bangla_qa/validation.jsonl
  - data/processed/v2_bengali_news/validation.jsonl
  - data/processed/bangla_reading_qa/validation.jsonl
  - data/processed/hindi_history_qa/validation.jsonl
  - data/processed/hinglish_chat/validation.jsonl
  - data/processed/hindi_hinglish/validation.jsonl
  - data/processed/v2_hindi_news/validation.jsonl
  - data/processed/code_alpaca/validation.jsonl
  - data/processed/preferences/validation.jsonl
  - data/processed/fineweb_edu/validation.jsonl
  - data/processed/code_pretraining/validation.jsonl
validation_domains:
    english:
      - data/processed/preferences/validation.jsonl
      - data/processed/helpsteer/validation.jsonl
      - data/processed/openorca/validation.jsonl
      - data/processed/general_qa/validation.jsonl
      - data/processed/writing_editing/validation.jsonl
      - data/processed/safety_alignment/validation.jsonl
      - data/processed/fineweb_edu/validation.jsonl
    bengali:
      - data/processed/bangla_qa/validation.jsonl
      - data/processed/v2_bengali_news/validation.jsonl
      - data/processed/bangla_reading_qa/validation.jsonl
      - data/processed/multilingual_bn_hi/validation.jsonl
    hindi:
      - data/processed/hindi_history_qa/validation.jsonl
      - data/processed/multilingual_hi/validation.jsonl
      - data/processed/hinglish_chat/validation.jsonl
      - data/processed/hindi_hinglish/validation.jsonl
      - data/processed/v2_hindi_news/validation.jsonl
    coding:
      - data/processed/code_instructions/validation.jsonl
      - data/processed/v2_code_feedback/validation.jsonl
      - data/processed/code_alpaca/validation.jsonl
      - data/processed/tool_calling/validation.jsonl
      - data/processed/code_pretraining/validation.jsonl
    gsm8k:
      - data/processed/gsm8k/validation.jsonl
      - data/processed/v2_math_instruct/validation.jsonl
    chat:
      - data/processed/ultrachat_200k/validation.jsonl
      - data/processed/v2_openassistant_en/validation.jsonl
      - data/processed/core_chat/validation.jsonl
      - data/processed/emoji_chat/validation.jsonl
validation_weights:
  # General-purpose checkpoint gate: prioritize conversation and English while
  # requiring useful math, coding, Bengali, and Hindi capability.
  chat: 0.24
  gsm8k: 0.15
  coding: 0.15
  bengali: 0.13
  hindi: 0.15
  english: 0.18
validation_metric_name: dataset_weighted_v3_broad_sft_domains
learning_rate: 0.00001
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: auto
gradient_clip_norm: 1.0
gradient_accumulation_steps: 16
mixed_precision: bf16
lr_schedule: cosine
warmup_ratio: 0.05
min_lr_ratio: 0.1
# EMA smooths short-term update noise; broad validation still determines the
# deployable checkpoint. It requires a second full parameter copy on the GPU.
ema_decay: 0.999
log_every: 25
log_interval_seconds: 2
checkpoint_every: 500
evaluate_every: 4000
early_stopping_patience: 2
early_stopping_min_delta: 0.001
ignore_index: -100
label_smoothing: 0.0
z_loss_coefficient: 0.0001
shift_labels: true
loss_reduction: mean

# Bound FP32 loss intermediates; backward recomputes each chunk to save memory.
# Set to 0 for the original unchunked loss (less recomputation).
loss_chunk_size: 128

extends: defaults/training-runtime.yaml
runtime:
  tokenizer: data/tokenizer-finetuning
  output: checkpoints/finetuning/latest.pt
  best_output: checkpoints/finetuning/best.pt
  log_file: logs/finetuning.log
  report_json: reports/finetuning.json
