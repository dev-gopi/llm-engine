# Quality-first SFT profile for the 16-layer model and its 42K append-only
# fine-tuning tokenizer (40K pretrained tokens plus 2K new tokens).
# The 1M-sample epoch matches pretraining coverage while the effective batch of
# 64 keeps updates stable and preserves the conservative 1e-5 SFT learning rate.
batch_size: 2
validation_batch_size: 4
epochs: 2
seed: 42
dataset_governance:
  policy: warn
  stage: sft
  commercial_use: false
max_sequence_length: 512
pad_to_multiple_of: 8
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
lazy_dataset: true
distributed_strategy: ddp
distributed_backend: null
checkpoint_format: single_file
samples_per_epoch: 1000000
dataset_weights:
  # Preference data contributes chosen responses only. Wikipedia, FineWeb-Edu,
  # and CodeParrot contribute causal-LM examples at deliberately small shares.
  ultrachat_200k: 0.06
  v2_openassistant_en: 0.03
  helpsteer: 0.08
  openorca: 0.05
  gsm8k: 0.13
  v2_math_instruct: 0.05
  core_chat: 0.02
  code_instructions: 0.03
  v2_code_feedback: 0.04
  general_qa: 0.06
  safety_alignment: 0.025
  writing_editing: 0.015
  multilingual_bn_hi: 0.05
  multilingual_hi: 0.04
  tool_calling: 0.015
  emoji_chat: 0.005
  bangla_qa: 0.02
  v2_bengali_news: 0.03
  bangla_reading_qa: 0.04
  hindi_history_qa: 0.02
  hinglish_chat: 0.01
  hindi_hinglish: 0.02
  v2_hindi_news: 0.03
  code_alpaca: 0.03
  preferences: 0.02
  wikipedia_en: 0.01
  wikipedia_simple: 0.01
  wikipedia_bn: 0.01
  wikipedia_hi: 0.01
  fineweb_edu: 0.02
  code_pretraining: 0.02
train_files:
  - data/processed/ultrachat_200k/train.jsonl
  - data/processed/v2_openassistant_en/train.jsonl
  - data/processed/helpsteer/train.jsonl
  - data/processed/openorca/train.jsonl
  - data/processed/gsm8k/train.jsonl
  - data/processed/v2_math_instruct/train.jsonl
  - data/processed/core_chat/train.jsonl
  - data/processed/code_instructions/train.jsonl
  - data/processed/v2_code_feedback/train.jsonl
  - data/processed/general_qa/train.jsonl
  - data/processed/safety_alignment/train.jsonl
  - data/processed/writing_editing/train.jsonl
  - data/processed/multilingual_bn_hi/train.jsonl
  - data/processed/multilingual_hi/train.jsonl
  - data/processed/tool_calling/train.jsonl
  - data/processed/emoji_chat/train.jsonl
  - data/processed/bangla_qa/train.jsonl
  - data/processed/v2_bengali_news/train.jsonl
  - data/processed/bangla_reading_qa/train.jsonl
  - data/processed/hindi_history_qa/train.jsonl
  - data/processed/hinglish_chat/train.jsonl
  - data/processed/hindi_hinglish/train.jsonl
  - data/processed/v2_hindi_news/train.jsonl
  - data/processed/code_alpaca/train.jsonl
  - data/processed/preferences/train.jsonl
  - data/rag/wikipedia/wikipedia-en.jsonl
  - data/rag/wikipedia/wikipedia-simple.jsonl
  - data/rag/wikipedia/wikipedia-bn.jsonl
  - data/rag/wikipedia/wikipedia-hi.jsonl
  - data/processed/fineweb_edu/train.jsonl
  - data/processed/code_pretraining/train.jsonl
validation_files:
  - data/processed/ultrachat_200k/validation.jsonl
  - data/processed/v2_openassistant_en/validation.jsonl
  - data/processed/helpsteer/validation.jsonl
  - data/processed/openorca/validation.jsonl
  - data/processed/gsm8k/validation.jsonl
  - data/processed/v2_math_instruct/validation.jsonl
  - data/processed/core_chat/validation.jsonl
  - data/processed/code_instructions/validation.jsonl
