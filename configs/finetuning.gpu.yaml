batch_size: 2
epochs: 3
seed: 42
dataset_governance:
  policy: warn
  stage: sft
  commercial_use: false
max_sequence_length: 256
num_workers: 2
pin_memory: true
lazy_dataset: true
distributed_strategy: ddp
distributed_backend: null
checkpoint_format: single_file
train_files:
  - data/processed/ultrachat_200k/train.jsonl
  - data/processed/helpsteer/train.jsonl
  - data/processed/openorca/train.jsonl
validation_files:
  - data/processed/ultrachat_200k/validation.jsonl
  - data/processed/helpsteer/validation.jsonl
  - data/processed/openorca/validation.jsonl
learning_rate: 0.00005
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: false
gradient_clip_norm: 1.0
gradient_accumulation_steps: 16
mixed_precision: fp16
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.1
ema_decay: 0.999
log_every: 25
checkpoint_every: 1000
evaluate_every: null
early_stopping_patience: 2
early_stopping_min_delta: 0.001
ignore_index: -100
label_smoothing: 0.05
z_loss_coefficient: 0.0001
shift_labels: true
loss_reduction: mean
