# Multi-GPU example for configs/model.future.1b.yaml. Requires torchrun, CUDA,
# BF16-capable GPUs, data/tokenizer-v2, and the binary shard manifest below.
batch_size: 1
epochs: 1
seed: 42
dataset_governance:
  policy: warn
  stage: pretraining
  commercial_use: false
max_sequence_length: 2048
num_workers: 4
pin_memory: true
lazy_dataset: true
distributed_strategy: fsdp
distributed_backend: nccl
checkpoint_format: distributed
train_files:
  - data/shards/pretraining-v2/manifest.json
validation_files: []
learning_rate: 0.0003
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: true
gradient_clip_norm: 1.0
gradient_accumulation_steps: 32
mixed_precision: bf16
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.1
log_every: 10
checkpoint_every: 500
evaluate_every: null
early_stopping_patience: null
early_stopping_min_delta: 0.0
ignore_index: -100
label_smoothing: 0.0
z_loss_coefficient: 0.0001
shift_labels: true
loss_reduction: mean
