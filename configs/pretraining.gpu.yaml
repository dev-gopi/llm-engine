# Continued pretraining for the active grown GPU model. Four epochs request up
# to 4M sampled examples; use held-out validation and early stopping to choose
# the actual stopping point. The 512-token sequence length is within the
# 1024-token limit in model.gpu.yaml.
batch_size: 2
validation_batch_size: 2
epochs: 4
seed: 42
dataset_governance:
  policy: warn
  stage: pretraining
  commercial_use: false
  # DATA-003 is an acquisition/audit gate. Keep this disabled until every
  # capability source has a reviewed schema-v2 manifest and a passed audit.
  capability_audit: true
  required_domains:
    - web
    - documentation
    - code
    - mathematics
    - science
    - multilingual
    - conversation
    - instruction
    - reasoning
    - tool-use
max_sequence_length: 512
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
lazy_dataset: true
distributed_strategy: ddp
distributed_backend: null
checkpoint_format: single_file
samples_per_epoch: 1000000
train_files:
  - data/processed/tinystories/train.jsonl
  - data/processed/wikitext_103/train.jsonl
dataset_weights:
  tinystories: 0.10
  wikitext_103: 0.90
# Weights use the train_files/dataset_weights order. Stage selection is saved
# in trainer state, while sampler state retains active group weights for safe
# resume if batch size changes.
curriculum:
  - start_epoch: 0
    weights: [0.10, 0.90]
  - start_epoch: 2
    weights: [0.20, 0.80]
# Versioned candidate sources for the next governed mixture stage. They are
# declared here for reproducibility and auditability; train_files above remain
# the active laptop profile until each source has local, reviewed artifacts.
# DATA-003 capability catalog. These are governance declarations only; they do
# not enter train_files until their schema-v2 manifests pass the strict audit.
capability_corpus:
  activation: blocked_until_audit
  required_domains:
    - web
    - documentation
    - code
    - mathematics
    - science
    - multilingual
    - conversation
    - instruction
    - reasoning
    - tool-use
  sources:
    - {name: fineweb_edu, domain: web, manifest: data/processed/fineweb_edu/dataset-manifest.yaml}
    - {name: wikipedia_en, domain: documentation, manifest: data/rag/wikipedia/dataset-manifest.yaml}
    - {name: code_pretraining, domain: code, manifest: data/processed/code_pretraining/dataset-manifest.yaml}
    - {name: v2_math_instruct, domain: mathematics, manifest: data/processed/v2_math_instruct/dataset-manifest.yaml}
    - {name: science_pending, domain: science, manifest: data/processed/science/dataset-manifest.yaml}
    - {name: multilingual_bn_hi, domain: multilingual, manifest: data/processed/multilingual_bn_hi/dataset-manifest.yaml}
    - {name: ultrachat_200k, domain: conversation, manifest: data/processed/ultrachat_200k/dataset-manifest.yaml}
    - {name: bangla_qa, domain: instruction, manifest: data/processed/bangla_qa/dataset-manifest.yaml}
    - {name: hindi_hinglish, domain: reasoning, manifest: data/processed/hindi_hinglish/dataset-manifest.yaml}
    - {name: tool_calling, domain: tool-use, manifest: data/processed/tool_calling/dataset-manifest.yaml}

dataset_mixture:
  - name: fineweb_edu
    domain: web
    version: "2025-01-reviewed"
    paths: [data/processed/fineweb_edu/train.jsonl]
    weight: 0.55
    license: ODC-BY-1.0
    quality_metrics: {deduplication_rate: 0.0, pii_redaction_rate: 0.0}
  - name: code_pretraining
    domain: code
    version: "2025-01-reviewed"
    paths: [data/processed/code_pretraining/train.jsonl]
    weight: 0.20
    license: Apache-2.0
    quality_metrics: {deduplication_rate: 0.0, pii_redaction_rate: 0.0}
  - name: math_reasoning
    domain: math
    version: "2025-01-reviewed"
    paths: [data/processed/math_reasoning/train.jsonl]
    weight: 0.15
    license: CC-BY-4.0
    quality_metrics: {deduplication_rate: 0.0, pii_redaction_rate: 0.0}
  - name: reasoning_traces
    domain: reasoning
    version: "2025-01-reviewed"
    paths: [data/processed/reasoning_traces/train.jsonl]
    weight: 0.10
    license: CC-BY-SA-4.0
    quality_metrics: {deduplication_rate: 0.0, pii_redaction_rate: 0.0}
validation_files:
  - data/processed/tinystories/validation.jsonl
  - data/processed/wikitext_103/validation.jsonl
validation_domains:
  tinystories:
    - data/processed/tinystories/validation.jsonl
  wikitext_103:
    - data/processed/wikitext_103/validation.jsonl
validation_weights:
  tinystories: 0.10
  wikitext_103: 0.90
validation_metric_name: dataset_weighted_grown_v2_tinystories_10_wikitext_90_v1
learning_rate: 0.00005
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: false
gradient_clip_norm: 1.0
gradient_accumulation_steps: 16
mixed_precision: fp16
grad_scaler_initial_scale: 1024
grad_scaler_growth_interval: 20000
lr_schedule: cosine
warmup_ratio: 0.05
min_lr_ratio: 0.1
# Smooth long-run pretraining updates; select the deployable checkpoint using
# held-out validation rather than loss alone.
ema_decay: 0.999
log_every: 25
checkpoint_every: 1000
evaluate_every: 2000
early_stopping_patience: 3
early_stopping_min_delta: 0.001
ignore_index: -100
label_smoothing: 0.0
z_loss_coefficient: 0.0001
shift_labels: true
loss_reduction: mean

extends: defaults/training-runtime.yaml
runtime:
  tokenizer: data/tokenizer
  output: checkpoints/pretraining/latest.pt
  best_output: checkpoints/pretraining/best.pt
  log_file: logs/pretraining.log
  report_json: reports/pretraining.json

# CTX-002 paired long-context profiles. These are explicit opt-in profiles; the
# active 512-token training mixture above remains unchanged.
long_context_profiles:
  "2k":
    model_config: configs/model.long_context.2k.gpu.yaml
    training_config: configs/pretraining.long_context.2k.gpu.yaml
    max_position: 2048
    max_sequence_length: 2048
  "4k":
    model_config: configs/model.long_context.4k.gpu.yaml
    training_config: configs/pretraining.long_context.4k.gpu.yaml
    max_position: 4096
    max_sequence_length: 4096
  "8k":
    model_config: configs/model.long_context.8k.gpu.yaml
    training_config: configs/pretraining.long_context.8k.gpu.yaml
    max_position: 8192
    max_sequence_length: 8192

# DATA-005/006/007 reproducibility controls. These are audit/reporting knobs;
# the active train_files mixture remains unchanged until reviewed reports are accepted.
dataset_quality_scoring:
  enabled: true
  protocol: deterministic-heuristic-v1
  quality_weighted_mixture: false
  report: reports/dataset_quality.json

dataset_ablation:
  enabled: false
  protocol: recorded-checkpoint-capability-v1
  baseline: base
  observations_file: experiments/data_mixture_ablation/observations.json
  report: reports/data_mixture_ablation.json

packing_efficiency:
  enabled: true
  report: reports/packing_efficiency.json
  sequence_capacity: 512
  batch_size: 2
  pad_to_multiple_of: null
