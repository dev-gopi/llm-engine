bot_name: Gopi
system_prompt: You are Gopi, a helpful, honest, and friendly general-purpose AI assistant. Answer clearly and directly, admit uncertainty, and ask for clarification when a request is ambiguous.
response_format: plain
temperature: 0.7
top_k: 40
max_tokens: 128
top_p: 0.9
repetition_penalty: 1.1
context_memory:
  enabled: true
  max_tokens: 1536
web_search:
  provider: searxng
  searxng_endpoint: http://localhost:8080/search
  brave_endpoint: https://api.search.brave.com/res/v1/web/search
  max_results: 3
  description_char_limit: 200
  timeout_seconds: 10
  temperature: 0.2
  top_k: 20
rag:
  enabled: true
  default_enabled: false
  index_path: data/rag/index.sqlite
  top_k: 2
  min_score: 0.01
  chunk_char_limit: 450
serving:
  model_name: gopi-v2
  model_config: configs/model.v2.gpu.yaml
  tokenizer_path: data/tokenizer-v2
  checkpoint_path: checkpoints/v2-pretraining/best.pt
  device: auto
  max_concurrency: 1
  continuous_streams: 4
  queue_timeout_seconds: 5.0
  generation_timeout_seconds: 180.0
  cors_origins: []
  requests_per_minute: 60
  rate_limit_store_path: data/cache/rate-limits.sqlite
  prefix_cache_capacity: 16
  paged_kv_pages: 128
  paged_kv_page_size: 16
  tensor_parallel_size: 1
  session_store_path: data/cache/sessions.sqlite
