# Conservative post-SFT refinement stage. Put reviewed correction examples in
# data/processed/refinement/{train,validation}.jsonl, then mix them with the
# cleaned recovery corpus to retain broad instruction-following ability.
# Initialize from the current best SFT or recovery checkpoint; never use this
# profile with --resume when the data mixture has changed.
batch_size: 1
validation_batch_size: 2
epochs: 2
seed: 42
dataset_governance:
  policy: warn
  stage: sft
  commercial_use: false
max_sequence_length: 512
pad_to_multiple_of: 8
num_workers: 1
pin_memory: true
persistent_workers: true
prefetch_factor: 2
lazy_dataset: true
distributed_strategy: ddp
distributed_backend: null
checkpoint_format: single_file
# A bounded stage reduces overfitting when the correction corpus is small.
samples_per_epoch: 10000
dataset_weights:
  refinement: 0.60
  chat: 0.12
  english: 0.08
  bengali: 0.06
  hindi: 0.04
  math: 0.06
  coding: 0.04
train_files:
  - data/processed/refinement/train.jsonl
  - data/processed/recovery_sft/chat/train.jsonl
  - data/processed/recovery_sft/english/train.jsonl
  - data/processed/recovery_sft/bengali/train.jsonl
  - data/processed/recovery_sft/hindi/train.jsonl
  - data/processed/recovery_sft/math/train.jsonl
  - data/processed/recovery_sft/coding/train.jsonl
validation_files:
  - data/processed/refinement/validation.jsonl
  - data/processed/recovery_sft/chat/validation.jsonl
  - data/processed/recovery_sft/english/validation.jsonl
  - data/processed/recovery_sft/bengali/validation.jsonl
  - data/processed/recovery_sft/hindi/validation.jsonl
  - data/processed/recovery_sft/math/validation.jsonl
  - data/processed/recovery_sft/coding/validation.jsonl
validation_domains:
  refinement: [data/processed/refinement/validation.jsonl]
  chat: [data/processed/recovery_sft/chat/validation.jsonl]
  english: [data/processed/recovery_sft/english/validation.jsonl]
  bengali: [data/processed/recovery_sft/bengali/validation.jsonl]
  hindi: [data/processed/recovery_sft/hindi/validation.jsonl]
  math: [data/processed/recovery_sft/math/validation.jsonl]
  coding: [data/processed/recovery_sft/coding/validation.jsonl]
validation_weights:
  refinement: 0.60
  chat: 0.12
  english: 0.08
  bengali: 0.06
  hindi: 0.04
  math: 0.06
  coding: 0.04
validation_metric_name: refinement_weighted_v1
learning_rate: 0.000005
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: false
gradient_clip_norm: 1.0
gradient_accumulation_steps: 32
mixed_precision: bf16
lr_schedule: cosine
warmup_ratio: 0.05
min_lr_ratio: 0.1
ema_decay: 0.999
log_every: 25
checkpoint_every: 250
evaluate_every: 250
early_stopping_patience: 3
early_stopping_min_delta: 0.001
ignore_index: -100
label_smoothing: 0.0
z_loss_coefficient: 0.0001
shift_labels: true
loss_reduction: mean
