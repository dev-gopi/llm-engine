# Clean response-quality recovery for the active 80.29M, 16-layer model.
# Initialize from checkpoints/finetuning/best.pt with the same
# data/tokenizer-finetuning tokenizer used for that SFT checkpoint. This profile
# is runnable because the cleaned recovery files have been prepared locally.
batch_size: 1
validation_batch_size: 2
epochs: 2
seed: 42
dataset_governance:
  policy: warn
  stage: sft
  commercial_use: false
max_sequence_length: 256
pad_to_multiple_of: 8
num_workers: 1
pin_memory: true
persistent_workers: true
prefetch_factor: 2
lazy_dataset: true
distributed_strategy: ddp
distributed_backend: null
checkpoint_format: single_file
samples_per_epoch: 100000
dataset_weights:
  chat: 0.30
  english: 0.20
  bengali: 0.15
  hindi: 0.10
  math: 0.15
  coding: 0.10
train_files:
  - data/processed/recovery_sft/chat/train.jsonl
  - data/processed/recovery_sft/english/train.jsonl
  - data/processed/recovery_sft/bengali/train.jsonl
  - data/processed/recovery_sft/hindi/train.jsonl
  - data/processed/recovery_sft/math/train.jsonl
  - data/processed/recovery_sft/coding/train.jsonl
validation_files:
  - data/processed/recovery_sft/chat/validation.jsonl
  - data/processed/recovery_sft/english/validation.jsonl
  - data/processed/recovery_sft/bengali/validation.jsonl
  - data/processed/recovery_sft/hindi/validation.jsonl
  - data/processed/recovery_sft/math/validation.jsonl
  - data/processed/recovery_sft/coding/validation.jsonl
validation_domains:
  chat: [data/processed/recovery_sft/chat/validation.jsonl]
  english: [data/processed/recovery_sft/english/validation.jsonl]
  bengali: [data/processed/recovery_sft/bengali/validation.jsonl]
  hindi: [data/processed/recovery_sft/hindi/validation.jsonl]
  math: [data/processed/recovery_sft/math/validation.jsonl]
  coding: [data/processed/recovery_sft/coding/validation.jsonl]
validation_weights:
  chat: 0.30
  english: 0.20
  bengali: 0.15
  hindi: 0.10
  math: 0.15
  coding: 0.10
validation_metric_name: dataset_weighted_v2_recovery_domains_v1
# The broad SFT run has already converged; use a smaller restart LR to repair
# instruction following without rapidly overwriting its learned capabilities.
learning_rate: 0.000005
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: false
gradient_clip_norm: 1.0
gradient_accumulation_steps: 32
mixed_precision: bf16
lr_schedule: cosine
warmup_ratio: 0.05
min_lr_ratio: 0.1
ema_decay: 0.999
log_every: 25
checkpoint_every: 1000
evaluate_every: 1000
generation_evaluation:
  enabled: true
  cases: configs/evaluation.domains.jsonl
  inference_config: configs/inference.yaml
  output: reports/recovery-generation-quality.json
  max_tokens: 64
  repetition_penalty: 1.05
  no_repeat_ngram_size: 0
early_stopping_patience: 2
early_stopping_min_delta: 0.001
ignore_index: -100
label_smoothing: 0.0
z_loss_coefficient: 0.0001
shift_labels: true
loss_reduction: mean

extends: defaults/training-runtime.yaml
runtime:
  tokenizer: data/tokenizer-finetuning
  output: checkpoints/recovery/latest.pt
  best_output: checkpoints/recovery/best.pt
  log_file: logs/recovery.log
  report_json: reports/recovery.json
