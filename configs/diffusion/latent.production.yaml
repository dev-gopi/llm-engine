# Native from-scratch latent diffusion architecture. Train the VAE first.
image_size: 256
image_channels: 3
latent_channels: 4
latent_scale: 0.18215
vae_base_channels: 128
vae_downsample_factor: 8
vae_batch_size: 16
vae_epochs: 50
vae_learning_rate: 0.0001
vae_weight_decay: 0.01
vae_output: checkpoints/diffusion/vae.pt
kl_weight: 0.000001
base_channels: 192
condition_size: 512
use_attention: true
use_cross_attention: true
attention_heads: 8
dropout: 0.1
text_hidden_size: 512
text_layers: 8
text_heads: 8
text_max_length: 128
text_dropout: 0.1
text_padding_idx: 0
timesteps: 1000
noise_schedule: cosine
beta_start: 0.0001
beta_end: 0.02
inference_steps: 50
condition_dropout: 0.1
guidance_scale: 5.0
train_data: data/images/diffusion/train
validation_data: data/images/diffusion/validation
num_workers: 8
seed: 42
mixed_precision: bf16
max_grad_norm: 1.0
warmup_ratio: 0.03
lr_schedule: cosine
min_lr_ratio: 0.05
train_resize_mode: random_crop
eval_resize_mode: center_crop
image_normalization: minus_one_one
horizontal_flip: true
horizontal_flip_probability: 0.5
color_jitter: 0.0
