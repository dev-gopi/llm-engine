image_size: 64
image_channels: 3
base_channels: 32
condition_size: 128
dropout: 0.0
use_attention: false
attention_heads: 4
timesteps: 100
noise_schedule: linear
beta_start: 0.0001
beta_end: 0.02
inference_steps: 50
train_data: data/images/diffusion/train
# Add validation_data after creating a held-out image split.
batch_size: 8
num_workers: 2
epochs: 10
learning_rate: 0.0002
weight_decay: 0.01
max_grad_norm: 1.0
log_every_steps: 10
save_every_steps: 100
output: checkpoints/diffusion/local.pt
seed: 42
validation_seed: 1234
horizontal_flip: true
horizontal_flip_probability: 0.5
train_resize_mode: random_crop
eval_resize_mode: center_crop
image_normalization: minus_one_one
color_jitter: 0.0
mixed_precision: none
ema_decay: 0.999
warmup_ratio: 0.03
lr_schedule: cosine
min_lr_ratio: 0.1
