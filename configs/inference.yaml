# Active inference and serving defaults.
bot_name: Gopi
system_prompt: You are Gopi, a helpful assistant. Answer clearly and briefly.
response_format: plain
# This compact checkpoint was trained with the short system prompt above. Keep
# safety enforcement in the request filter rather than injecting an unseen,
# refusal-heavy paragraph into every model prompt.
embed_safety_instruction: false
temperature: 0.15
top_k: 20
max_tokens: 128
top_p: 0.9
# Optional relative probability cutoff; disabled for compatibility.
min_p: 0.0
min_tokens: 1
stop: []
repetition_penalty: 1.05
no_repeat_ngram_size: 0
context_memory:
  enabled: true
  # Match the model's 1,024-token context; generation reserves max_tokens from it.
  max_tokens: 1024
web_search:
  provider: searxng
  searxng_endpoint: http://localhost:8080/search
  brave_endpoint: https://api.search.brave.com/res/v1/web/search
  max_results: 3
  description_char_limit: 200
  timeout_seconds: 10
  temperature: 0.2
  top_k: 20
rag:
  enabled: true
  default_enabled: false
  index_path: data/rag/index.sqlite
  # Retrieve a broad candidate pool, then rerank before generation.
  candidate_k: 20
  top_k: 5
  rerank_enabled: true
  reranker: lexical
  # For a neural cross-encoder, set reranker: sentence_transformers and install
  # the optional `rerank` extra.
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  reranker_batch_size: 16
  min_score: 0.01
  chunk_char_limit: 180
  attachment_char_limit: 300
serving:
  model_name: gopi
  model_config: configs/model.gpu.yaml
  tokenizer_path: data/tokenizer-finetuning
  checkpoint_path: checkpoints/finetuning/best.pt
  device: auto
  max_concurrency: 1
  continuous_streams: 4
  queue_timeout_seconds: 5.0
  generation_timeout_seconds: 180.0
  session_memory_enabled: true
  # Set true before exposing the server; false is loopback-development only.
  authentication_enabled: false
  cors_origins: []
  requests_per_minute: 60
  rate_limit_store_path: data/cache/rate-limits.sqlite
  # Optional two-tier exact + semantic response cache. It is disabled by
  # default because semantic reuse must be explicitly enabled for a deployment.
  # Dynamic requests (sessions, tools, RAG, web search, attachments, reasoning)
  # and non-deterministic sampling are bypassed unless explicitly permitted.
  semantic_cache_enabled: false
  semantic_cache_capacity: 512
  semantic_cache_similarity_threshold: 0.985
  semantic_cache_ttl_seconds: 3600
  semantic_cache_namespace: gopi-v1
  semantic_cache_store_path: data/cache/semantic-responses.sqlite
  semantic_cache_allow_nondeterministic: false
  # Optional distributed cache. When configured, Redis stores exact + semantic
  # entries, cross-replica single-flight locks and bounded vector candidates.
  semantic_cache_redis_url: null
  semantic_cache_redis_prefix: llm-engine:semantic-cache
  semantic_cache_tenant_max_entries: 0
  # Optional OIDC/JWT authentication. A static HS256 secret is intended only for
  # private deployments/tests; production should use issuer/audience + JWKS.
  oidc_enabled: false
  oidc_issuer: null
  oidc_audience: null
  oidc_jwks_url: null
  oidc_hs256_secret: null
  tenant_requests_per_minute: 0
  otel_enabled: false
  otel_endpoint: null
  platform_db_path: data/cache/openai-platform.sqlite3
  platform_files_dir: data/cache/openai-files
  lora_adapter_root: adapters
  webhook_url: null
  webhook_secret: null
  # Four full 1,024-token streams consume 256 pages at this page size. Keep
  # another 256 pages for four hot full-context prefixes; 512 BF16 pages are
  # about 32 MiB for the active 16-layer GQA model.
  prefix_cache_capacity: 4
  paged_kv_pages: 512
  paged_kv_page_size: 16
  # INT8 halves KV payload memory but retains FP32 per-token scales; qualify
  # output quality and throughput on the target GPU before enabling it.
  paged_kv_quantization: none
  # Bound prompt prefill activation memory without changing results. The full
  # KV state remains resident, but transient attention allocations stay bounded.
  prefill_chunk_size: 256
  tensor_parallel_size: 1
  # Optional native speculative-decoding draft model. Requests select it with
  # decoding_strategy=speculative and draft_model_id matching this id.
  speculative_draft_model_id: null
  speculative_draft_checkpoint: null
  speculative_draft_model_config: null
  # mmap the PyTorch checkpoint and assign its tensors without a second full
  # state-dict copy. bfloat16 halves resident weight memory after loading.
  low_memory_loading: true
  weight_dtype: bfloat16
  # CPU-only alternative: int8_dynamic. It reduces steady-state Linear weight
  # memory further but is not supported on CUDA.
  quantization: none
  # Native vision is enabled only when a trained VisionLanguageModel artifact
  # is supplied. Keep the checkpoint null for text-only deployments.
  multimodal_config: configs/vision/multimodal.yaml
  multimodal_checkpoint: null
  # Optional fallback when the multimodal checkpoint contains projector weights
  # but not vision_encoder.* weights (for example a VisionClassifier checkpoint).
  vision_checkpoint: null
  vision_allow_remote_images: false
  vision_max_image_bytes: 10485760
  vision_max_images: 4
  session_store_path: data/cache/sessions.sqlite
  workspace_agent_enabled: false
  workspace_root: .
