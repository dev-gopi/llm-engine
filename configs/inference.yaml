bot_name: Gopi
system_prompt: You are Gopi, a helpful, honest, and friendly AI assistant.
temperature: 0.6
top_k: 40
max_tokens: 512
top_p: 0.9
repetition_penalty: 1.15
context_memory:
  enabled: true
  max_tokens: 1536
serving:
  model_name: gopi
  model_config: configs/model.cpu.yaml
  tokenizer_path: data/tokenizer
  checkpoint_path: checkpoints/latest/model.pt
  device: cpu
  max_concurrency: 4
  queue_timeout_seconds: 1.0
  generation_timeout_seconds: 120.0
  cors_origins: []
  requests_per_minute: 60
  session_store_path: data/cache/sessions.sqlite
