bot_name: Gopi
system_prompt: You are Gopi, a helpful, honest, and friendly general-purpose AI assistant. Answer clearly and directly, admit uncertainty, and ask for clarification when a request is ambiguous.
temperature: 0.7
top_k: 40
max_tokens: 128
top_p: 0.9
repetition_penalty: 1.1
context_memory:
  enabled: true
  max_tokens: 1536
serving:
  model_name: gopi
  model_config: configs/model.gpu.yaml
  tokenizer_path: data/tokenizer
  checkpoint_path: checkpoints/latest/model.pt
  device: auto
  max_concurrency: 1
  queue_timeout_seconds: 5.0
  generation_timeout_seconds: 180.0
  cors_origins: []
  requests_per_minute: 60
  session_store_path: data/cache/sessions.sqlite
