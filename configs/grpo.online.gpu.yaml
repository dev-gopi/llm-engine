distributed_strategy: ddp
batch_size: 1
iterations: 2
updates_per_rollout: 1
max_groups_per_iteration: 128
group_size: 4
replay_capacity_groups: 256
seed: 42
max_sequence_length: 512
num_workers: 2
prompt_files:
  - data/processed/grpo/prompts.jsonl
learning_rate: 0.000005
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: auto
gradient_clip_norm: 1.0
mixed_precision: bf16
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.1
clip_epsilon: 0.2
beta: 0.04
reward_model_weight: 1.0
exact_match_weight: 0.0
normalize_reward_model: true
rollout_max_tokens: 128
rollout_temperature: 0.8
rollout_top_k: 40
rollout_top_p: 1.0
rollout_min_p: 0.0
rollout_repetition_penalty: 1.1
rollout_no_repeat_ngram_size: 3
rollout_min_tokens: 1
log_every: 10
runtime:
  tokenizer: data/tokenizer-finetuning
  output: checkpoints/grpo-online/latest.pt
  rollout_dir: data/processed/grpo/online
  replay_file: data/processed/grpo/online-replay.jsonl
