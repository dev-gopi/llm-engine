# Broad-quality CPU supervised fine-tuning profile. This is the slower,
# lower-capacity counterpart to finetuning.gpu.yaml; its sequence length uses
# the full context available in model.cpu.yaml.
batch_size: 1
# At most 100K sampled examples. Retain early stopping and select the best
# held-out checkpoint instead of assuming a third pass improves SFT quality.
epochs: 2
seed: 42
dataset_governance:
  policy: warn
  stage: sft
  commercial_use: false
max_sequence_length: 512
num_workers: 2
pin_memory: false
persistent_workers: true
prefetch_factor: 1
lazy_dataset: true
distributed_strategy: ddp
distributed_backend: null
checkpoint_format: single_file
samples_per_epoch: 50000
dataset_weights:
  # Example-level weights total exactly 1.0. Audit sampled token shares before
  # training because source records have different average lengths.
  ultrachat_200k: 0.14
  helpsteer: 0.06
  openorca: 0.10
  gsm8k: 0.14
  core_chat: 0.03
  code_instructions: 0.07
  general_qa: 0.10
  safety_alignment: 0.02
  writing_editing: 0.01
  multilingual_bn_hi: 0.06
  multilingual_hi: 0.055
  tool_calling: 0.025
  emoji_chat: 0.01
  bangla_qa: 0.055
  bangla_reading_qa: 0.04
  hindi_history_qa: 0.025
  hinglish_chat: 0.015
  code_alpaca: 0.045
train_files:
  - data/processed/ultrachat_200k/train.jsonl
  - data/processed/helpsteer/train.jsonl
  - data/processed/openorca/train.jsonl
  - data/processed/gsm8k/train.jsonl
  - data/processed/core_chat/train.jsonl
  - data/processed/code_instructions/train.jsonl
  - data/processed/general_qa/train.jsonl
  - data/processed/safety_alignment/train.jsonl
  - data/processed/writing_editing/train.jsonl
  - data/processed/multilingual_bn_hi/train.jsonl
  - data/processed/multilingual_hi/train.jsonl
  - data/processed/tool_calling/train.jsonl
  - data/processed/emoji_chat/train.jsonl
  - data/processed/bangla_qa/train.jsonl
  - data/processed/bangla_reading_qa/train.jsonl
  - data/processed/hindi_history_qa/train.jsonl
  - data/processed/hinglish_chat/train.jsonl
  - data/processed/code_alpaca/train.jsonl
validation_files:
  - data/processed/ultrachat_200k/validation.jsonl
  - data/processed/helpsteer/validation.jsonl
  - data/processed/openorca/validation.jsonl
  - data/processed/gsm8k/validation.jsonl
  - data/processed/core_chat/validation.jsonl
  - data/processed/code_instructions/validation.jsonl
  - data/processed/general_qa/validation.jsonl
  - data/processed/safety_alignment/validation.jsonl
  - data/processed/writing_editing/validation.jsonl
  - data/processed/multilingual_bn_hi/validation.jsonl
  - data/processed/multilingual_hi/validation.jsonl
  - data/processed/tool_calling/validation.jsonl
  - data/processed/emoji_chat/validation.jsonl
  - data/processed/bangla_qa/validation.jsonl
  - data/processed/bangla_reading_qa/validation.jsonl
  - data/processed/hindi_history_qa/validation.jsonl
  - data/processed/hinglish_chat/validation.jsonl
  - data/processed/code_alpaca/validation.jsonl
validation_domains:
    english:
      - data/processed/helpsteer/validation.jsonl
      - data/processed/openorca/validation.jsonl
      - data/processed/general_qa/validation.jsonl
      - data/processed/writing_editing/validation.jsonl
      - data/processed/safety_alignment/validation.jsonl
    bengali:
      - data/processed/bangla_qa/validation.jsonl
      - data/processed/bangla_reading_qa/validation.jsonl
      - data/processed/multilingual_bn_hi/validation.jsonl
    hindi:
      - data/processed/hindi_history_qa/validation.jsonl
      - data/processed/multilingual_hi/validation.jsonl
      - data/processed/hinglish_chat/validation.jsonl
    coding:
      - data/processed/code_instructions/validation.jsonl
      - data/processed/code_alpaca/validation.jsonl
      - data/processed/tool_calling/validation.jsonl
    gsm8k:
      - data/processed/gsm8k/validation.jsonl
    chat:
      - data/processed/ultrachat_200k/validation.jsonl
      - data/processed/core_chat/validation.jsonl
      - data/processed/emoji_chat/validation.jsonl
validation_weights:
  # Do not select a CPU checkpoint that improves one priority while regressing
  # chat, reasoning, coding, Bengali, Hindi, or general English.
  english: 0.13
  bengali: 0.14
  hindi: 0.15
  coding: 0.17
  gsm8k: 0.18
  chat: 0.23
validation_metric_name: dataset_weighted_v3_broad_cpu_sft_domains
learning_rate: 0.00003
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: false
gradient_clip_norm: 1.0
gradient_accumulation_steps: 32
mixed_precision: none
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.1
# A short SFT stage uses direct broad-validation selection instead of EMA.
ema_decay: null
log_every: 25
checkpoint_every: 1000
evaluate_every: 1000
early_stopping_patience: 2
early_stopping_min_delta: 0.001
ignore_index: -100
label_smoothing: 0.0
z_loss_coefficient: 0.0001
shift_labels: true
loss_reduction: mean
