method: kto
batch_size: 2
epochs: 2
seed: 42
max_sequence_length: 1024
num_workers: 2
train_files:
  - data/processed/preferences/train.jsonl
validation_files:
  - data/processed/preferences/validation.jsonl
dataset_governance:
  policy: warn
  stage: kto
  commercial_use: false
learning_rate: 0.00001
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: auto
gradient_clip_norm: 1.0
mixed_precision: bf16
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.1
beta: 0.1
kto_desirable_weight: 1.0
kto_undesirable_weight: 1.0
label_smoothing: 0.0
log_every: 10
early_stopping_patience: 2
distributed_strategy: ddp
runtime:
  tokenizer: data/tokenizer-finetuning
  output: checkpoints/kto/latest.pt
  best_output: checkpoints/kto/best.pt
