batch_size: 1
epochs: 3
seed: 42
dataset_governance:
  policy: warn
  stage: sft
  commercial_use: false
max_sequence_length: 384
num_workers: 1
pin_memory: true
persistent_workers: true
prefetch_factor: 2
distributed_strategy: ddp
distributed_backend: null
checkpoint_format: single_file
samples_per_epoch: 500000
dataset_weights:
  # Quality-balanced SFT mixture: chat 25%, factual 25%, reasoning 13%,
  # code 10%, Bengali 14%, Hindi/Hinglish 7%, and safety/tools 6%.
  ultrachat_200k: 0.15
  helpsteer: 0.08
  openorca: 0.13
  gsm8k: 0.13
  core_chat: 0.02
  code_instructions: 0.07
  general_qa: 0.12
  safety_alignment: 0.025
  writing_editing: 0.015
  multilingual_bn_hi: 0.05
  multilingual_hi: 0.04
  tool_calling: 0.015
  emoji_chat: 0.005
  bangla_qa: 0.05
  bangla_reading_qa: 0.04
  hindi_history_qa: 0.02
  hinglish_chat: 0.01
  code_alpaca: 0.03
train_files:
  - data/shards/finetuning-v2/train/ultrachat_200k/manifest.json
  - data/shards/finetuning-v2/train/helpsteer/manifest.json
  - data/shards/finetuning-v2/train/openorca/manifest.json
  - data/shards/finetuning-v2/train/gsm8k/manifest.json
  - data/shards/finetuning-v2/train/core_chat/manifest.json
  - data/shards/finetuning-v2/train/code_instructions/manifest.json
  - data/shards/finetuning-v2/train/general_qa/manifest.json
  - data/shards/finetuning-v2/train/safety_alignment/manifest.json
  - data/shards/finetuning-v2/train/writing_editing/manifest.json
  - data/shards/finetuning-v2/train/multilingual_bn_hi/manifest.json
  - data/shards/finetuning-v2/train/multilingual_hi/manifest.json
  - data/shards/finetuning-v2/train/tool_calling/manifest.json
  - data/shards/finetuning-v2/train/emoji_chat/manifest.json
  - data/shards/finetuning-v2/train/bangla_qa/manifest.json
  - data/shards/finetuning-v2/train/bangla_reading_qa/manifest.json
  - data/shards/finetuning-v2/train/hindi_history_qa/manifest.json
  - data/shards/finetuning-v2/train/hinglish_chat/manifest.json
  - data/shards/finetuning-v2/train/code_alpaca/manifest.json
validation_files:
  - data/shards/finetuning-v2/validation/ultrachat_200k/manifest.json
  - data/shards/finetuning-v2/validation/helpsteer/manifest.json
  - data/shards/finetuning-v2/validation/openorca/manifest.json
  - data/shards/finetuning-v2/validation/gsm8k/manifest.json
  - data/shards/finetuning-v2/validation/core_chat/manifest.json
  - data/shards/finetuning-v2/validation/code_instructions/manifest.json
  - data/shards/finetuning-v2/validation/general_qa/manifest.json
  - data/shards/finetuning-v2/validation/safety_alignment/manifest.json
  - data/shards/finetuning-v2/validation/writing_editing/manifest.json
  - data/shards/finetuning-v2/validation/multilingual_bn_hi/manifest.json
  - data/shards/finetuning-v2/validation/multilingual_hi/manifest.json
  - data/shards/finetuning-v2/validation/tool_calling/manifest.json
  - data/shards/finetuning-v2/validation/emoji_chat/manifest.json
  - data/shards/finetuning-v2/validation/bangla_qa/manifest.json
  - data/shards/finetuning-v2/validation/bangla_reading_qa/manifest.json
  - data/shards/finetuning-v2/validation/hindi_history_qa/manifest.json
  - data/shards/finetuning-v2/validation/hinglish_chat/manifest.json
  - data/shards/finetuning-v2/validation/code_alpaca/manifest.json
validation_domains:
    english:
      - data/shards/finetuning-v2/validation/helpsteer/manifest.json
      - data/shards/finetuning-v2/validation/openorca/manifest.json
      - data/shards/finetuning-v2/validation/general_qa/manifest.json
      - data/shards/finetuning-v2/validation/writing_editing/manifest.json
      - data/shards/finetuning-v2/validation/safety_alignment/manifest.json
    bengali:
      - data/shards/finetuning-v2/validation/bangla_qa/manifest.json
      - data/shards/finetuning-v2/validation/bangla_reading_qa/manifest.json
      - data/shards/finetuning-v2/validation/multilingual_bn_hi/manifest.json
    hindi:
      - data/shards/finetuning-v2/validation/hindi_history_qa/manifest.json
      - data/shards/finetuning-v2/validation/multilingual_hi/manifest.json
      - data/shards/finetuning-v2/validation/hinglish_chat/manifest.json
    coding:
      - data/shards/finetuning-v2/validation/code_instructions/manifest.json
      - data/shards/finetuning-v2/validation/code_alpaca/manifest.json
      - data/shards/finetuning-v2/validation/tool_calling/manifest.json
    gsm8k:
      - data/shards/finetuning-v2/validation/gsm8k/manifest.json
    chat:
      - data/shards/finetuning-v2/validation/ultrachat_200k/manifest.json
      - data/shards/finetuning-v2/validation/core_chat/manifest.json
      - data/shards/finetuning-v2/validation/emoji_chat/manifest.json
validation_weights:
  english: 0.15
  bengali: 0.14
  hindi: 0.07
  coding: 0.10
  gsm8k: 0.13
  chat: 0.41
validation_metric_name: dataset_weighted_sft_domains_v2
learning_rate: 0.00003
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
adam_epsilon: 0.00000001
fused_optimizer: false
gradient_clip_norm: 1.0
gradient_accumulation_steps: 32
mixed_precision: bf16
lr_schedule: cosine
warmup_ratio: 0.03
min_lr_ratio: 0.1
ema_decay: 0.999
log_every: 25
checkpoint_every: 1000
evaluate_every: 2000
early_stopping_patience: 2
early_stopping_min_delta: 0.001
ignore_index: -100
# label_smoothing: 0.3
label_smoothing: 0.0
z_loss_coefficient: 0.0001
shift_labels: true
loss_reduction: mean
