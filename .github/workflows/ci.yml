name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install ruff

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,images]"

      - name: Run test suite
        run: |
          python -m pytest \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Audit task registry
        run: python scripts/audit_task_registry.py

  implementation-audit:
    name: Implementation audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reject NotImplementedError
        shell: bash
        run: |
          if grep -R \
            --line-number \
            --include='*.py' \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=tests \
            --exclude-dir=.venv \
            --exclude-dir=venv \
            --exclude-dir=build \
            --exclude-dir=dist \
            --exclude-dir=__pycache__ \
            'NotImplementedError' .; then
            echo "Found NotImplementedError in production Python code."
            exit 1
          fi

          echo "Implementation audit passed: no NotImplementedError found."

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build
        run: python -m build

      - name: Validate distribution
        run: python -m twine check dist/*