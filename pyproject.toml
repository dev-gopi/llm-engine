[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-engine"
version = "0.1.0"
description = "A configuration-driven GPT-style language model engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<0.116",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "numpy>=1.26",
    "pillow>=10",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "regex>=2024.5.15",
    "safetensors>=0.4",
    "torch>=2.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24,<1", "datasets>=2.19", "datatrove>=0.3"]
data = ["datasets>=2.19", "datatrove>=0.3"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
rag = ["pypdf>=5", "python-docx>=1.1", "openpyxl>=3.1"]
rerank = ["sentence-transformers>=3.0"]
images = []
media = ["pillow>=10", "av>=12", "soundfile>=0.12"]
audio = ["soundfile>=0.12", "av>=12"]
speech = ["transformers>=4.45,<5", "accelerate>=0.34", "soundfile>=0.12"]
video = ["pillow>=10", "av>=12"]
queue = ["redis>=5,<6"]
storage = ["boto3>=1.34,<2"]
full = [
    "datasets>=2.19",
    "datatrove>=0.3",
    "pillow>=10",
    "av>=12",
    "soundfile>=0.12",
    "transformers>=4.45,<5",
    "accelerate>=0.34",
    "redis>=5,<6",
    "boto3>=1.34,<2",
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = ["--import-mode=importlib"]
