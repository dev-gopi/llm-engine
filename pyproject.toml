[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-engine"
version = "0.1.0"
description = "A configuration-driven GPT-style language model engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "numpy",
    "pyarrow",
    "pyyaml",
    "regex",
    "safetensors",
    "torch",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["httpx", "pytest"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
